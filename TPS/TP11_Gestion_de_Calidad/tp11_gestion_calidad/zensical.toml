[project]
site_name = "TP11_Gestion_de_Calidad"
site_url = "https://Chate19.github.io/tp11_gestion_calidad/"
repo_url = "https://github.com/Chate19/tp11_gestion_calidad"
repo_name = "Chate19/tp11_gestion_calidad"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
